site_name: Modelos de IA (5071) — Apuntes CE IA&BD
site_description: Materiales docentes del módulo 5071 "Modelos de Inteligencia Artificial" (Comunitat Valenciana, 2026-2027)
site_author: José Manuel Pérez Torres
repo_url: https://github.com/jmperez-profesor/mia
site_url: https://jmperez-profesor.github.io/mia/

edit_uri: edit/main/docs
use_directory_urls: false

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo claro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo oscuro
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra:
  colab:
    user: jmperez-profesor
    repo: mia
    branch: main
  raw_base: https://raw.githubusercontent.com/jmperez-profesor/mia/main

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
  - minify:
      minify_html: true
  - redirects
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - mkdocs-jupyter:
      include_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/js/init.js

extra_css:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.css

hooks:
  - hooks.py

nav:
  - Inicio: index.md
  - Normativa: normativa/index.md
  - "B01 · RA1 — Caracterización de sistemas IA":
      - Introducción: bloques/B01_RA1/index.md
      - "Apuntes (RA1)": bloques/B01_RA1/apuntes.md
      - "Recursos NotebookLM": bloques/B01_RA1/recursos_nbl.md
      - "S01 · Introducción a la IA y tipos de sistemas (05/10/2026)":
          - Plan de sesión: bloques/B01_RA1/sesion01.md
          - Práctica:
              - Ejercicios de autoevaluación: bloques/B01_RA1/ejercicios_s01.md
              - N01 Técnicas de IA: bloques/B01_RA1/sesion01_tecnicas_ia.ipynb
              - N02 Mapa de sistemas inteligentes: bloques/B01_RA1/sesion01_mapa_sistemas.ipynb
          - Entregas:
              - Miniproyecto: bloques/B01_RA1/sesion01_miniproyecto.ipynb
  - "B05 · RA5 — Sistemas expertos y motores de reglas":
      - Introducción: bloques/B05_RA5/index.md
      - "Apuntes (3 sesiones)": bloques/B05_RA5/apuntes.md
      - "S2 · Sistemas expertos (19/10/2026)":
          - Notebook: bloques/B05_RA5/sesion02_sistemas_expertos.ipynb
      - "S3 · Motores de reglas (21/10/2026)":
          - Notebook: bloques/B05_RA5/sesion03_motores_reglas.ipynb
      - "S4 · Motores de reglas 2 (26/10/2026)":
          - Notebook: bloques/B05_RA5/sesion04_hibridos_guardarrailes.ipynb
      - Ejercicios de autoevaluación: bloques/B05_RA5/ejercicios.md
  - "B04 · RA4 — Análisis de sistemas robotizados":
      - Introducción: bloques/B04_RA4/index.md
      - "Apuntes (DOBOT Magician)": bloques/B04_RA4/apuntes.md
      - "Guía docente": bloques/B04_RA4/guia_docente.md
      - Actividades:
          - "Act1 · Cinemática": bloques/B04_RA4/actividades/act1_cinematica.md
          - "Act2 · Reto de dibujo": bloques/B04_RA4/actividades/act2_reto_dibujo.md
          - "Act3 · Pick & place": bloques/B04_RA4/actividades/act3_pick_place.md
      - "Cuadernos Colab":
          - "Cinemática": bloques/B04_RA4/colab/UD04_cinematica.ipynb
          - "Reto de dibujo (plantilla)": bloques/B04_RA4/colab/UD04_reto_dibujo_plantilla.ipynb
          - "Pick & place (plantilla)": bloques/B04_RA4/colab/UD04_pick_place_plantilla.ipynb
      - "Rúbrica RA4": bloques/B04_RA4/rubrica.md
  - Evaluación:
      - Índice: evaluacion/index.md
      - "RA1 · Caracterización de sistemas IA": evaluacion/RA1.md
      - "RA5 · Sistemas expertos y motores de reglas": evaluacion/RA5.md
      - "RA4 · Análisis de sistemas robotizados": evaluacion/RA4.md
