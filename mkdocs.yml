site_name: Modelos de IA (5071) — Apuntes CE IA&BD
site_description: Materiales docentes del módulo 5071 "Modelos de Inteligencia Artificial" (Comunitat Valenciana, 2026-2027)
site_author: José Manuel Pérez Torres
repo_url: https://github.com/jmperez-profesor/mia
site_url: https://jmperez-profesor.github.io/mia/

edit_uri: edit/main/docs
use_directory_urls: false

# Ocultar los cuadernos de soluciones (S9/S11/S14) mientras duran las clases.
# Para volver a mostrarlos, comenta o elimina las líneas siguientes.
exclude_docs: |
  bloques/B05_RA5/*_soluciones.ipynb

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo claro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo oscuro
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight
    - header.autohide

extra:
  colab:
    user: jmperez-profesor
    repo: mia
    branch: main
  raw_base: https://raw.githubusercontent.com/jmperez-profesor/mia/main

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      zoomable: true
  - minify:
      minify_html: true
  - redirects
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - mkdocs-jupyter:
      include_source: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/js/init.js

extra_css:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.css

hooks:
  - hooks.py

nav:
  - Inicio: index.md
  - Normativa: normativa/index.md
  - "RA1 - Caracterización de sistemas IA":
      - Introducción: bloques/B01_RA1/index.md
      - "Apuntes (RA1)": bloques/B01_RA1/apuntes.md
      - "Recursos Gemini Notebook": bloques/B01_RA1/recursos_nbl.md
#      - "Recursos de vídeo (DotCSV)": bloques/B01_RA1/recursos_video.md
#      - "Guion de sesión con vídeo": bloques/B01_RA1/guion_video.md
      - "S01 · Introducción a la IA y tipos de sistemas (05/10/2026)":
          #- Plan de sesión: bloques/B01_RA1/sesion01.md
          - "Guía de clase (apuntes + vídeos + ejercicios)": bloques/B01_RA1/guia_clase.md
#          - "Presentación de clase": presentaciones/b01_s01.html
          - Práctica:
              - Ejercicios de autoevaluación: bloques/B01_RA1/ejercicios_s01.md
              - N01 La ficha de 1 minuto (Colab): bloques/B01_RA1/sesion01_mapa_sistemas.ipynb
              - N02 Técnicas de IA: bloques/B01_RA1/sesion01_tecnicas_ia.ipynb
              
#          - Entregas:
#             - Miniproyecto: bloques/B01_RA1/sesion01_miniproyecto.ipynb
          #- "Consulta (retirable en evaluación)":
          #    - "Soluciones de prácticas": bloques/B01_RA1/soluciones_s01.md
         #    - "Preguntas frecuentes": bloques/B01_RA1/faq_s01.md
  - "RA5 - Sistemas expertos y motores de reglas":
      - Introducción: bloques/B05_RA5/index.md
      - "S9 · Sistemas expertos (19/10/2026)": bloques/B05_RA5/sesion09_sistemas_expertos.md
      - "S11 · Motores de reglas (21/10/2026)": bloques/B05_RA5/sesion11_motores_reglas.md
      - "S20 · Motores de reglas híbridos y guardarraíles (04/11/2026)": bloques/B05_RA5/sesion20_motores_reglas_hibridos_guardarrailes.md
  - "RA4 - Análisis de sistemas robotizados":
      - Introducción: bloques/B04_RA4/index.md
      - "S21 · Sistemas robotizados. Actuadores (04/11/2026)": bloques/B04_RA4/sesion21_sistemas_robotizados.md
      - "S25 · Brazo robótico 1 (11/11/2026)": bloques/B04_RA4/sesion25_brazo_robotico_1.md
      - "S26 · Brazo robótico 2 (11/11/2026)": bloques/B04_RA4/sesion26_brazo_robotico_2.md
#   - Recursos:
#       - "Canal DotCSV": recursos/dotcsv.md
#   - Evaluación:
#       - Índice: evaluacion/index.md
#       - "RA1 · Caracterización de sistemas IA": evaluacion/RA1.md
#       - "RA5 · Sistemas expertos y motores de reglas": evaluacion/RA5.md
