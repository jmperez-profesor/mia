site_name: Modelos de IA (5071) — Apuntes CE IA&BD
site_description: Materiales docentes del módulo 5071 "Modelos de Inteligencia Artificial" (Comunitat Valenciana, 2026-2027)
site_author: José Manuel Pérez Torres
repo_url: https://github.com/jmperez-profesor/mia
site_url: https://jmperez-profesor.github.io/mia/

edit_uri: edit/main/docs
use_directory_urls: false

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo claro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo oscuro
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra:
  colab:
    user: jmperez-profesor
    repo: mia
    branch: main
  raw_base: https://raw.githubusercontent.com/jmperez-profesor/mia/main

plugins:
  - search
  - minify:
      minify_html: true
  - redirects
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - mkdocs-jupyter:
      include_source: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/js/init.js

extra_css:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.css

hooks:
  - hooks.py

nav:
  - Inicio: index.md
  - Normativa: normativa/index.md
  - "B01 · RA1 — Caracterización de sistemas IA":
      - Introducción: bloques/B01_RA1/index.md
      - "S01 · Introducción a la IA y tipos de sistemas (05/10/2026)":
          - Apuntes: bloques/B01_RA1/sesion01.md
          - Práctica:
              - Ejercicios de autoevaluación: bloques/B01_RA1/ejercicios_s01.md
              - N01 Técnicas de IA: bloques/B01_RA1/sesion01_tecnicas_ia.ipynb
              - N02 Mapa de sistemas inteligentes: bloques/B01_RA1/sesion01_mapa_sistemas.ipynb
          - Entregas:
              - Miniproyecto: bloques/B01_RA1/sesion01_miniproyecto.ipynb
  # - "B02 · RA2 — Modelos de resolución de problemas":
  #     - Introducción: bloques/B02_RA2/index.md
  #     - "S01 · Espacios de estados y búsqueda no informada": bloques/B02_RA2/sesion01.md
  #     - "S02 · Búsqueda informada: A* y heurísticas": bloques/B02_RA2/sesion02.md
  #     - "S03 · Búsqueda local": bloques/B02_RA2/sesion03.md
  #     - "S04 · Algoritmos genéticos I": bloques/B02_RA2/sesion04.md
  #     - "S05 · Algoritmos genéticos II": bloques/B02_RA2/sesion05.md
  #     - "S06 · Satisfacción de restricciones (CSP)": bloques/B02_RA2/sesion06.md
  #     - "S07 · Planificación: STRIPS": bloques/B02_RA2/sesion07.md
  #     - "S08 · Programación lógica con Prolog": bloques/B02_RA2/sesion08.md
  #     - "S09 · Motores de reglas e inferencia": bloques/B02_RA2/sesion09.md
  #     - "S10 · Miniproyecto RA2": bloques/B02_RA2/sesion10.md
  - "B05 · RA5 — Sistemas expertos y motores de reglas":
      - Introducción: bloques/B05_RA5/index.md
      - "Apuntes (3 sesiones)": bloques/B05_RA5/apuntes.md
      - "S2 · Sistemas expertos (19/10/2026)":
          - Notebook: bloques/B05_RA5/sesion02_sistemas_expertos.ipynb
      - "S3 · Motores de reglas (21/10/2026)":
          - Notebook: bloques/B05_RA5/sesion03_motores_reglas.ipynb
      - "S4 · Motores de reglas 2 (26/10/2026)":
          - Notebook: bloques/B05_RA5/sesion04_hibridos_guardarrailes.ipynb
      - Ejercicios de autoevaluación: bloques/B05_RA5/ejercicios.md
  - Evaluación:
      - Índice: evaluacion/index.md
      - "RA1 · Caracterización de sistemas IA": evaluacion/RA1.md
      - "RA2 · Modelos de resolución de problemas": evaluacion/RA2.md
      - "RA3 · PLN": evaluacion/RA3.md
