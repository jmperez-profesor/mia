  #     - "S06 · Satisfacción de restricciones (CSP)": bloques/B02_RA2/sesion06.md
  #     - "S07 · Planificación: STRIPS": bloques/B02_RA2/sesion07.md
  #     - "S08 · Programación lógica con Prolog": bloques/B02_RA2/sesion08.md
  #     - "S09 · Motores de reglas e inferencia": bloques/B02_RA2/sesion09.md
  #     - "S10 · Miniproyecto RA2": bloques/B02_RA2/sesion10.md
  # - "B03 · RA3 — Procesamiento de lenguaje natural":
