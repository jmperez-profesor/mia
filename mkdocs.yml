site_name: Modelos de IA (5071) — Apuntes CE IA&BD
site_description: Materiales docentes del módulo 5071 "Modelos de Inteligencia Artificial" (Comunitat Valenciana, 2026-2027)
site_author: José Manuel Pérez Torres
repo_url: https://github.com/jmperez-profesor/mia
site_url: https://jmperez-profesor.github.io/mia/

edit_uri: edit/main/docs
use_directory_urls: false

theme:
  name: material
  language: es
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Modo claro
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Modo oscuro
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

extra:
  colab:
    user: jmperez-profesor
    repo: mia
    branch: main
  raw_base: https://raw.githubusercontent.com/jmperez-profesor/mia/main

plugins:
  - search
  - minify:
      minify_html: true
  - redirects
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
  - mkdocs-jupyter:
      include_source: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js
  - assets/js/init.js

extra_css:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.css

hooks:
  - hooks.py

nav:
  - Inicio: index.md
  - Normativa: normativa/index.md
  - "B01 · RA1 — Caracterización de sistemas IA":
      - Introducción: bloques/B01_RA1/index.md
      - "S01 · Introducción a la IA y tipos de sistemas (05/10/2026)": bloques/B01_RA1/sesion01.md
      - "S02 · IA 1: Actualidad y fundamentos (19/10/2026)": bloques/B01_RA1/sesion02.md
      - "S03 · IA 2: Entornos actuales y fases (21/10/2026)": bloques/B01_RA1/sesion03.md
      - "S04 · IA 3: Ciclo del dato y preprocesamiento (26/10/2026)": bloques/B01_RA1/sesion04.md
      - "S05 · IA 4: De ML a LLM (28/10/2026)": bloques/B01_RA1/sesion05.md
      - "S06 · IA y eficiencia operativa I": bloques/B01_RA1/sesion06.md
      - "S07 · IA y eficiencia operativa II": bloques/B01_RA1/sesion07.md
      - "S08 · Evaluación crítica y Miniproyecto RA1": bloques/B01_RA1/sesion08.md
