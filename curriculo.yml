# curriculo.yml — FUENTE ÚNICA de datos curriculares del módulo 5071 (adaptado a nuestro centro).
#
# Adaptado de material_david/datos/curriculo.yml (proyecto de referencia de D. Martínez Peña,
# IES Eduardo Primo Marqués, Carlet) a nuestro instituto y a nuestro curso.
#
# ALCANCE DE ESTE DOCENTE: RA1, RA5 y RA4. En este tramo se imparten RA1 (1 sesión) y
# RA5 (3 sesiones), lunes y miércoles, 2 h por sesión; RA4 va después (ver PLAN.md §5).
# Los RA2, RA3, RA6 y RA7 los imparten otros docentes (fuera de este proyecto).

modulo:
  codigo: "5071"
  denominacion: Modelos de Inteligencia Artificial
  curso_especializacion: Inteligencia Artificial y Big Data (Grado E)
  centro: "I.E.S. Severo Ochoa de Elche"
  curso_academico: "2026-2027"
  horas: 90                 # currículo CV (Decreto 95/2026)
  ects: 4
  horas_semanales: 3        # dosier CEICE-GVA (nosotros lo damos en 2 sesiones de 2 h)
  nuestras_horas: 12 h presenciales (6 sesiones de 2 h) + 6 h no presenciales (trabajo autónomo)
  semanas: 30
  fin_contenidos: finales de abril (semana 24)
  alcance_docente: [RA1, RA5, RA4]

# RA/CE prescriptivos: RD 279/2021 (art. 3.2 del Decreto 95/2026 CV).
# `imparte` marca qué resultados corresponden a este docente y cuáles a otros.
resultados_aprendizaje:
  - id: RA1
    ce: 4
    imparte: este docente
    enunciado: >-
      Caracteriza sistemas de Inteligencia Artificial relacionándolos con la mejora de la
      eficiencia operativa de las organizaciones y empresas.
  - id: RA2
    ce: 6
    imparte: este docente pero más adelante (en otro bloque)
    enunciado: >-
      Utiliza modelos de sistemas de Inteligencia Artificial implementando sistemas de
      resolución de problemas.
  - id: RA3
    ce: 7
    imparte: este docente pero más adelante (en otro bloque)
    enunciado: >-
      Relaciona el procesamiento de lenguaje natural con sus aplicaciones determinando su
      potencial e identificando sus limitaciones.
  - id: RA4
    ce: 4
    imparte: este docente
    enunciado: Analiza sistemas robotizados, evaluando opciones de diseño e implementación.
  - id: RA5
    ce: 5
    imparte: este docente
    enunciado: >-
      Aplica sistemas expertos evaluando la influencia de los controladores inteligentes en el
      comportamiento del sistema.
  - id: RA6
    ce: 6
    imparte: otro docente (Barragán, 2026-2027)
    enunciado: >-
      Aplica principios legales y éticos al desarrollo de la Inteligencia Artificial
      integrándolos como parte del proceso.
  - id: RA7
    ce: 9
    imparte: otros docentes (proyecto intermodular del curso)
    enunciado: >-
      Desarrolla un proyecto integrador que combine técnicas de IA y análisis de datos masivos
      para resolver un problema real o simulado, gestionando todo el ciclo de vida del proyecto.

# Temporalización del tramo de este docente (PLAN.md §5). Semanas contadas desde la semana
# del inicio de docencia (2026-10-01): semana 1 = 28/09-04/10, semana 2 = 05/10-11/10, ...
# El identificador UDxx queda ligado a su RA (UD05 = RA5 siempre) y NO al orden de impartición.
unidades:
  - id: UD01
    titulo: Caracterización de sistemas de IA
    ra: RA1
    imparte: este docente
    horas: 2 h presenciales (1 sesión)
    semana_inicio: 2
    semana_fin: 2
    fecha_inicio: 2026-10-05
    fecha_fin: 2026-10-05
  - id: UD05
    titulo: Sistemas expertos y motores de reglas
    ra: RA5
    imparte: este docente
    horas: 6 h presenciales (3 sesiones)
    semana_inicio: 4
    semana_fin: 5
    fecha_inicio: 2026-10-19
    fecha_fin: 2026-10-26
  - id: UD04
    titulo: Análisis de sistemas robotizados
    ra: RA4
    imparte: este docente
    horas: 6 h presenciales (3 sesiones) + 6 h trabajo autónomo (3 sesiones)
    semana_inicio: 5
    semana_fin: 7
    fecha_inicio: 2026-10-28
    fecha_fin: 2026-11-09
    sesiones:
      - {id: S5, fecha: 2026-10-28, tipo: presencial, contenido: "Robot, cinemática y problemas (FK/IK, singularidades)"}
      - {id: A1, fecha: 2026-11-02, tipo: autonoma, contenido: "Cinemática con roboticstoolbox-python (entregable)"}
      - {id: S6, fecha: 2026-11-04, tipo: presencial, contenido: "Planificación, percepción y programación (RRT, SLAM, ROS 2)"}
      - {id: A2, fecha: 2026-11-06, tipo: autonoma, contenido: "Navegación AITK: reglas vs. lógica difusa (entregable)"}
      - {id: S7, fecha: 2026-11-09, tipo: presencial, contenido: "Diseño e implementación de sistemas robotizados (ISO 10218:2025)"}
      - {id: A3, fecha: 2026-11-11, tipo: autonoma, contenido: "Proyecto: diseño de la célula LARA (entregable)"}

# Calendario real del curso 2026-2027 (referencia; verificado en DOGV 2026/24495,
# Resolución SAE 15/07/2026: docencia 01/10/2026 → 18/06/2027 máx.).
# Festivos/vacaciones del centro; para nuestras sesiones (lun/mié) ver PLAN.md §4.
calendario:
  inicio_docencia: 2026-10-01
  fin_curso_centro: 2027-05-28
  fin_maximo_legal: 2027-06-18
  dias_clase: [lunes, miércoles, viernes] # Los viernes son para RA7 (otros docentes)
  horas_semanales_curso: 20
  vacaciones:
    navidad: [2026-12-23, 2027-01-06]
    pascua: [2027-03-24, 2027-04-05]
  festivos:
    - {fecha: 2026-10-09, dia: viernes, afecta: false} # Día de la Comunitat Valenciana (viernes: RA7)
    - {fecha: 2026-10-12, dia: lunes, afecta: true}    # Fiesta Nacional de España
    - {fecha: 2026-12-07, dia: lunes, afecta: true}    # No lectivo en Elche
    - {fecha: 2026-12-08, dia: martes, afecta: false}  # Día de la Constitución Española
    - {fecha: 2027-03-19, dia: viernes, afecta: false} # San José (viernes: RA7)
  horario_modulo:
    confirmado: true
    sesiones_por_semana: 2
    dias: [lunes, miércoles]
    duracion_sesion: 2h
    nota: >-
      El módulo 5071 se imparte en 2 sesiones semanales de 2 h (lunes y miércoles).
      Las 4 h del viernes corresponden al proyecto intermodular RA7 (otros docentes).

# Evaluación (Orden 8/2025, CV): escala 1–10 sin decimales, nota mínima por RA = 5.
# Pesos de referencia del módulo completo; nuestra evaluación cubre RA1, RA4 y RA5.
evaluacion:
  peso_actividades: 40
  peso_prueba_escrita: 60
  nota_minima_por_ra: 5
  escala_calificacion: 1 a 10, sin decimales
  pesos_ra:
    RA1: 14.55
    RA2: 14.55
    RA3: 14.55
    RA4: 14.55
    RA5: 14.55
    RA6: 7.27
    RA7: 20
  alcance_evaluacion_docente: [RA1, RA5, RA4]
  nota: >-
    Pesos proporcionales a las horas lectivas de cada RA (Orden 8/2025 art. 5). RA1–RA5 (12 h)
    pesan 14,55 %; RA6 (6 h) pesa 7,27 %; RA7 se mantiene al 20 %. Alcanzar TODOS los RA del
    módulo es exigencia normativa (art. 5.1 Orden 8/2025 e Instrucciones 26-27).
